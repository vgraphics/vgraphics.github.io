      .party-legal { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  <body>
    <!-- The start-up (D:\Projects\Mine\CLAUDE.md): the party games' shared welcome from vgraphics.gr/tv/start-up/, the
         game's key art with the squishy loading bar in Palermo's look, and over it the VGraphics intro (a tap skips it).
         The demo's start-up.ts lets the welcome go 2 s after the intro at the earliest. Addresses relative to this page.
         The key art in every size, up to 8K: each screen loads the one that covers it (docs/art.md; the same as the
         phone's LOOK.keyArt, which key-art.test.ts checks). -->
    <div
      id="party-welcome"
      data-art="../game/art/key-wide.webp"
      data-art-tall="../game/art/key-tall.webp"
      data-art-srcset="../game/art/key-wide.webp 1920w, ../game/art/key-wide-2560.webp 2560w, ../game/art/key-wide-3840.webp 3840w, ../game/art/key-wide-7680.webp 7680w"
      data-art-sizes="(min-aspect-ratio: 16/9) 100vw, 177.78vh"
      data-art-tall-srcset="../game/art/key-tall.webp 1080w, ../game/art/key-tall-1440.webp 1440w, ../game/art/key-tall-1800.webp 1800w, ../game/art/key-tall-2160.webp 2160w, ../game/art/key-tall-3072.webp 3072w, ../game/art/key-tall-4320.webp 4320w"
      data-art-tall-sizes="(max-aspect-ratio: 1080/1935) 55.82vh, 100vw"
      data-logo="../game/art/logo.webp"
      data-accent="#E8B65A"
      data-accent-lip="#B8862E"
      data-track="#13243A"
      data-track-lip="#060D16"
      data-groove="#08111C"
      data-rim="#B8862E"
    ></div>
    <script src="../../tv/start-up/welcome.js"></script>
    <script src="../../tv/start-up/brand-intro.js" data-under="party-welcome" data-film="1080"></script>
    <!-- The page's one h1 (the site's check-site wants one): out of sight, for screen readers and search. page-lang.ts
         puts it in the page's language. -->
    <h1 class="demo-heading" data-say="pal.demo.heading">Palermo Noir demo: play a guided game online</h1>
    <div id="app"></div>
    <!-- The page is the product alone (D:\Projects\Mine\CLAUDE.md, "Play and try pages are the product alone"; George, 29
         Oct 2026: "When we play we play. No scroll needed."): the setup, then this slim bar, the window's height between
         them and nothing to scroll to. What Palermo Noir is and how the demo goes are on its About page. The bar is the
         site's screens' (its tools/lib/partials.mjs screenBar): the way back to Palermo Noir, its About page, its privacy
         policy and the legal line a game's screen keeps to, "© VGraphics" (the kit's PRODUCT_LEGAL_LINE; George, 29 Oct
         2026: "Apps just can say VGraphics."), the company's details and terms a tap away beside it where the row has
         room. In English here; page-lang.ts puts its words in the page's language. Gone while the game plays
         (palermo.css). -->
    <footer id="party-legal" class="party-legal demo-screen-bar">
      <a href="/palermo/" data-say="pal.demo.bar.home">&larr; Palermo Noir</a>
      <a href="/palermo/about/" data-say="kit.menu.about">About</a>
      <a href="/palermo/privacy.html" data-say="kit.legal.privacy">Privacy</a>

    </footer>
