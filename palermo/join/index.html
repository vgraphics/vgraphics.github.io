<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1623" />
    <meta name="description" content="Join a game of Palermo Noir: type the room's six-digit code, or scan the QR code on the TV." />
    <!-- A door to a room, not a page to find in search, as the phone page and the shared vgraphics.gr/join are. -->
    <meta name="robots" content="noindex" />
    <title>Join the game · Palermo Noir</title>
    <link rel="canonical" href="https://vgraphics.gr/palermo/join/" />
    <link rel="icon" href="../game/art/logo.svg" type="image/svg+xml" />
    <!-- The site's cursors (every page on vgraphics.gr links it; palermo.css sets Palermo's); vite-ignore leaves the
         site's own files to the site. -->
    <link rel="stylesheet" href="/assets/cursors.css"  />
    <!-- No text selection and no right-click, as on every page on vgraphics.gr (text fields excepted): the site's own script. -->
    <script src="/assets/no-select.js" defer ></script>
    <style>
      html, body { margin: 0; background: #0B1623; color: #EFE7D4; }
      /* The legal line, small, at the foot until the door draws, which then gives it a row of its own under the form
         (door-layout.tsx, LegalRow), so it never covers the button: a game's screen, this join door included, says only
         "© VGraphics" (George, 29 Oct 2026: "Apps just can say VGraphics."). */
      .party-legal { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0.5em 1em calc(0.5em + env(safe-area-inset-bottom));
        background: linear-gradient(rgba(11, 22, 35, 0), #0B1623 45%); color: rgba(239, 231, 212, 0.55); font: 12px/1.5 system-ui, sans-serif; text-align: center; }
      .party-legal a { color: inherit; }
      .party-legal { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    </style>
    <script type="module" crossorigin src="/palermo/game/join-C31l_JMA.js"></script>
    <link rel="modulepreload" crossorigin href="/palermo/game/wordmark-D3yzTQnI.js">
    <link rel="modulepreload" crossorigin href="/palermo/game/door-layout-DXZ7jAoE.js">
    <link rel="modulepreload" crossorigin href="/palermo/game/code-boxes-DMmzatTu.js">
    <link rel="stylesheet" crossorigin href="/palermo/game/wordmark-TZ_vLt_d.css">
  </head>
  <body>
    <!-- With a room's code and the phone page on the site, the phone goes straight on to the room; the door draws otherwise. -->
    <div id="app"></div>
    <!-- A product's legal line (the kit's PRODUCT_LEGAL_LINE), the same in every language. -->
    <footer id="party-legal" class="party-legal">&copy; 2026 VGraphics</footer>
  </body>
</html>
