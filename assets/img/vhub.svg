  </g>

  <!-- friends -->
  <rect x="66" y="330" width="388" height="64" rx="20" fill="#F6F2EA"/>
  <circle cx="104" cy="362" r="19" fill="#1F9F52" stroke="#F6F2EA" stroke-width="4"/>
  <circle cx="132" cy="362" r="19" fill="#EE4D5C" stroke="#F6F2EA" stroke-width="4"/>
  <circle cx="160" cy="362" r="19" fill="#1E88DA" stroke="#F6F2EA" stroke-width="4"/>
  <circle cx="188" cy="362" r="19" fill="#D9580E" stroke="#F6F2EA" stroke-width="4"/>
  <rect x="228" y="354" width="120" height="16" rx="8" fill="#CFCADB"/>
  <rect x="372" y="346" width="64" height="32" rx="16" fill="#4B4CD6"/>
  <path d="M396 362h16M404 354v16" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
