<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460">
  <!-- VHub, in development: one player card for every VGraphics game and app, with a level, achievements and friends. -->
  <rect x="34" y="34" width="452" height="392" rx="30" fill="#FFFFFF"/>

  <!-- picture, level ring and level -->
  <circle cx="132" cy="132" r="58" fill="none" stroke="#ECE8F6" stroke-width="11"/>
  <path d="M132 74a58 58 0 1 1-55.2 75.9" fill="none" stroke="#F4C430" stroke-width="11" stroke-linecap="round"/>
  <circle cx="132" cy="132" r="44" fill="#4B4CD6"/>
  <polygon points="132,106 138.6,122.4 156.2,123.6 142.7,135 146.9,152.2 132,142.8 117.1,152.2 121.3,135 107.8,123.6 125.4,122.4" fill="#fff"/>
  <rect x="104" y="176" width="56" height="28" rx="14" fill="#16151B"/>
  <text x="132" y="195.5" fill="#fff" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="800" text-anchor="middle">Lv 12</text>

  <!-- name and XP -->
  <rect x="216" y="96" width="186" height="20" rx="10" fill="#16151B"/>
  <rect x="216" y="128" width="118" height="12" rx="6" fill="#CFCADB"/>
  <rect x="216" y="158" width="230" height="12" rx="6" fill="#ECE8F6"/>
  <rect x="216" y="158" width="158" height="12" rx="6" fill="#F4C430"/>

  <!-- achievements -->
  <g transform="translate(88 266)">
    <polygon points="0,-24 20.8,-12 20.8,12 0,24 -20.8,12 -20.8,-12" fill="#F4C430"/>
    <path d="M-8 1l6 6 11-12" fill="none" stroke="#16151B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(158 266)">
    <circle r="23" fill="#EC7472"/>
    <path d="M0 11C-9 5-13-1-12-6c1-6 9-7 12-1 3-6 11-5 12 1 1 5-3 11-12 17z" fill="#fff"/>
  </g>
  <g transform="translate(228 266)">
    <path d="M0-24l19 7v12c0 13-8 22-19 28-11-6-19-15-19-28v-12z" fill="#74A2FF"/>
    <path d="M0-11l3.5 7.2 7.9 1.1-5.7 5.6 1.3 7.9L0 7.1l-7 3.7 1.3-7.9-5.7-5.6 7.9-1.1z" fill="#fff"/>
