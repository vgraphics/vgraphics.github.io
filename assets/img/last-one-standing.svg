<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Ποιος θα μείνει τελευταίος; (working title), in design: one question on the TV, the answers on every phone,
       and the room's players along the bottom of the screen, the ones knocked out greyed. -->
  <defs>
    <clipPath id="screen"><rect x="96" y="36" width="448" height="252" rx="12"/></clipPath>
  </defs>

  <rect x="82" y="22" width="476" height="280" rx="24" fill="#16151B"/>
  <path d="M286 302h68l12 20h-92z" fill="#16151B"/>
  <rect x="232" y="318" width="176" height="10" rx="5" fill="#16151B"/>

  <g clip-path="url(#screen)">
    <rect x="96" y="36" width="448" height="252" fill="#FFF8E6"/>

    <!-- the question and its clock -->
    <rect x="118" y="54" width="404" height="58" rx="15" fill="#16151B"/>
    <rect x="142" y="72" width="236" height="9" rx="4.5" fill="#fff"/>
    <rect x="142" y="89" width="160" height="9" rx="4.5" fill="#fff" opacity=".55"/>
    <circle cx="488" cy="83" r="17" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="5"/>
    <path d="M488 66a17 17 0 1 1-16.2 22.2" fill="none" stroke="#F4C430" stroke-width="5" stroke-linecap="round"/>

    <!-- four answers -->
    <rect x="118" y="124" width="198" height="50" rx="13" fill="#F4C430"/>
    <rect x="324" y="124" width="198" height="50" rx="13" fill="#EC7472"/>
    <rect x="118" y="182" width="198" height="50" rx="13" fill="#74A2FF"/>
    <rect x="324" y="182" width="198" height="50" rx="13" fill="#4B4CD6"/>
    <circle cx="143" cy="149" r="9" fill="#16151B"/><rect x="162" y="145" width="100" height="8" rx="4" fill="#16151B" opacity=".75"/>
    <circle cx="349" cy="149" r="9" fill="#16151B"/><rect x="368" y="145" width="84" height="8" rx="4" fill="#16151B" opacity=".75"/>
    <circle cx="143" cy="207" r="9" fill="#16151B"/><rect x="162" y="203" width="112" height="8" rx="4" fill="#16151B" opacity=".75"/>
    <circle cx="349" cy="207" r="9" fill="#fff"/><rect x="368" y="203" width="92" height="8" rx="4" fill="#fff" opacity=".85"/>

    <!-- the room: who is still standing -->
    <rect x="96" y="246" width="448" height="42" fill="#F1E8D2"/>
    <g>
      <circle cx="170" cy="267" r="12" fill="#EC7472"/>
      <circle cx="220" cy="267" r="12" fill="#B9B3C9"/><path d="M214 261l12 12M226 261l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="270" cy="267" r="12" fill="#74A2FF"/>
      <circle cx="320" cy="267" r="12" fill="#B9B3C9"/><path d="M314 261l12 12M326 261l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="370" cy="267" r="12" fill="#F4C430"/>
      <path d="M361 252l3-9 6 5 6-5 3 9z" fill="#F4C430" stroke="#16151B" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="420" cy="267" r="12" fill="#B9B3C9"/><path d="M414 261l12 12M426 261l-12 12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="470" cy="267" r="12" fill="#4B4CD6"/>
    </g>
  </g>

  <!-- the phones: everyone answers on their own -->
  <g transform="translate(206 338) rotate(-10)">
    <rect x="-37" y="-66" width="74" height="132" rx="14" fill="#16151B"/>
    <rect x="-31" y="-60" width="62" height="120" rx="9" fill="#FFF8E6"/>
    <rect x="-24" y="-46" width="48" height="19" rx="6" fill="#F4C430"/>
    <rect x="-24" y="-21" width="48" height="19" rx="6" fill="#EC7472"/>
    <rect x="-24" y="4" width="48" height="19" rx="6" fill="#74A2FF"/>
    <rect x="-24" y="29" width="48" height="19" rx="6" fill="#4B4CD6"/>
  </g>
  <g transform="translate(436 340) rotate(9)">
    <rect x="-37" y="-66" width="74" height="132" rx="14" fill="#16151B"/>
    <rect x="-31" y="-60" width="62" height="120" rx="9" fill="#FFF8E6"/>
    <rect x="-24" y="-46" width="48" height="19" rx="6" fill="#F4C430"/>
    <rect x="-24" y="-21" width="48" height="19" rx="6" fill="#EC7472" opacity=".35"/>
    <rect x="-24" y="4" width="48" height="19" rx="6" fill="#74A2FF" opacity=".35"/>
    <rect x="-24" y="29" width="48" height="19" rx="6" fill="#4B4CD6" opacity=".35"/>
    <path d="M-8-37l5 5 11-11" fill="none" stroke="#16151B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
