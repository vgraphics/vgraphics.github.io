    <rect x="-21" y="-31" width="42" height="62" rx="7" fill="#fff"/>
    <path d="M-15-3c0-5 4-8 9-8 3 0 5 2 6 4 1-2 3-4 6-4 5 0 9 3 9 8 0 6-5 11-10 11-3 0-4-2-5-4-1 2-2 4-5 4-5 0-10-5-10-11z" fill="#16151B"/>
