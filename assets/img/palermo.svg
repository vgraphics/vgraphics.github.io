<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420">
  <!-- Palermo Noir, in design: the TV shows the town at night and the narrator; every phone hides a role. -->
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15133A"/>
      <stop offset="1" stop-color="#3A2E88"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="640" height="420" fill="#fff"/>
      <circle cx="471" cy="84" r="27" fill="#000"/>
    </mask>
    <clipPath id="screen"><rect x="96" y="36" width="448" height="252" rx="12"/></clipPath>
  </defs>

  <rect x="82" y="22" width="476" height="280" rx="24" fill="#0D0C14"/>
  <path d="M286 302h68l12 20h-92z" fill="#0D0C14"/>
  <rect x="232" y="318" width="176" height="10" rx="5" fill="#0D0C14"/>

  <g clip-path="url(#screen)">
    <rect x="96" y="36" width="448" height="252" fill="url(#night)"/>
    <g fill="#fff">
      <circle cx="292" cy="62" r="2.2"/><circle cx="338" cy="98" r="1.5"/><circle cx="392" cy="58" r="1.9"/>
      <circle cx="526" cy="146" r="1.6"/><circle cx="276" cy="128" r="1.4"/><circle cx="414" cy="132" r="1.5"/>
      <circle cx="356" cy="152" r="1.2"/><circle cx="512" cy="56" r="1.3"/>
    </g>
    <circle cx="456" cy="94" r="31" fill="#F4C430" mask="url(#crescent)"/>

    <!-- the narrator -->
    <rect x="118" y="56" width="136" height="46" rx="15" fill="#fff"/>
    <path d="M140 98l-8 18 26-15z" fill="#fff"/>
    <circle cx="160" cy="79" r="5.5" fill="#4B4CD6"/><circle cx="186" cy="79" r="5.5" fill="#4B4CD6"/><circle cx="212" cy="79" r="5.5" fill="#4B4CD6"/>

    <!-- the town: houses, a bell tower, red domes and a palm -->
    <g fill="#0E0C25">
      <path d="M96 288V222h22v-10h12v10h22v76z"/>
      <path d="M152 288V172l17-32 17 32v116z"/>
      <path d="M186 288v-58h66v58z"/>
      <path d="M252 288v-50h92v50z"/>
      <path d="M344 288v-74h58v74z"/>
      <path d="M450 288v-62h94v62z"/>
      <path d="M422 288c2-26 6-50 16-70l5 2c-9 20-12 42-13 68z"/>
      <path d="M440 218c-16-8-30-6-40 4 12-2 26-1 38 2zM440 218c4-14 16-22 30-22-10 6-19 13-26 24zM440 218c14-4 28 0 36 10-12-4-24-6-34-6zM440 218c-6-12-18-18-30-16 11 4 20 10 26 18z"/>
    </g>
    <g fill="#EC7472">
      <path d="M260 238a12 12 0 0 1 24 0z"/>
      <path d="M286 238a12 12 0 0 1 24 0z"/>
      <path d="M312 238a12 12 0 0 1 24 0z"/>
    </g>
    <g fill="#F4C430">
      <rect x="106" y="238" width="8" height="10" rx="1.5"/><rect x="128" y="258" width="8" height="10" rx="1.5"/>
      <rect x="164" y="190" width="10" height="12" rx="5"/>
      <rect x="198" y="244" width="8" height="10" rx="1.5"/><rect x="230" y="262" width="8" height="10" rx="1.5"/>
      <rect x="356" y="230" width="8" height="10" rx="1.5"/><rect x="380" y="252" width="8" height="10" rx="1.5"/>
      <rect x="466" y="242" width="8" height="10" rx="1.5"/><rect x="492" y="262" width="8" height="10" rx="1.5"/><rect x="520" y="240" width="8" height="10" rx="1.5"/>
    </g>
  </g>

