    <circle cx="-6" cy="-1" r="3" fill="#fff"/><circle cx="6" cy="-1" r="3" fill="#fff"/>
  </g>
  <g transform="translate(368 324) rotate(5)">
    <rect x="-37" y="-66" width="74" height="132" rx="14" fill="#16151B"/>
    <rect x="-31" y="-60" width="62" height="120" rx="9" fill="#74A2FF"/>
    <rect x="-21" y="-31" width="42" height="62" rx="7" fill="#fff"/>
    <path d="M-15-3c0-5 4-8 9-8 3 0 5 2 6 4 1-2 3-4 6-4 5 0 9 3 9 8 0 6-5 11-10 11-3 0-4-2-5-4-1 2-2 4-5 4-5 0-10-5-10-11z" fill="#16151B"/>
    <circle cx="-6" cy="-1" r="3" fill="#fff"/><circle cx="6" cy="-1" r="3" fill="#fff"/>
  </g>
  <g transform="translate(454 338) rotate(13)">
