<!doctype html>
<!-- Dev-only: never served (.htaccess blocks /tools). The avatar menu's settings rows with a 4-label choice like Palermo
     Noir's home look, on the real account.css, to look at before Palermo is listed. The markup copies account.js's row().
     Open it from a local static server at the repo root: /tools/fixtures/long-choice.html -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Long choice fixture</title>
<link rel="stylesheet" href="/assets/account.css"><link rel="stylesheet" href="/assets/switch.css">
<style>body{margin:0;font-family:system-ui,sans-serif;background:#f6f1e6}.fx{width:min(360px,100%);margin:24px auto;background:#fff}</style>
</head><body>
<div class="vhub-menu fx" style="position:static;opacity:1;transform:none;visibility:visible">
 <section class="vm-settings"><h3 class="vm-section">Palermo Noir settings</h3><div class="vm-rows" id="rows"></div></section>
</div>
<script type="module">
import { isLongChoice } from "/assets/choice-layout.js";
const specs = [
  { label: "Quality", options: ["Low", "Medium", "High"], value: 1 },
  { label: "Motion", options: ["As the device", "Calmer"], value: 0 },
  { label: "Home look", options: ["The Promenade", "The Fountain", "The Rain", "The Lamplighter"], value: 2 },
];
const rows = document.getElementById("rows");
specs.forEach((s, n) => {
  const cards = isLongChoice(s.options, s.label);
  const row = document.createElement("div");
  row.className = cards ? "vm-row vm-row-stack" : "vm-row";
  row.innerHTML = `<span class="vm-row-words"><span class="vm-row-name" id="n${n}">${s.label}</span></span>`;
  const g = document.createElement("div");
  g.className = cards ? "vm-seg vm-cards" : "vm-seg";
  g.setAttribute("role", "radiogroup"); g.setAttribute("aria-labelledby", "n" + n);
  const bs = s.options.map((o, i) => { const b = document.createElement("button"); b.type = "button"; b.setAttribute("role", "radio"); b.textContent = o; return b; });
  const pick = (at) => bs.forEach((b, i) => { b.setAttribute("aria-checked", String(i === at)); b.tabIndex = i === at ? 0 : -1; });
  bs.forEach((b, i) => b.addEventListener("click", () => pick(i)));
  g.addEventListener("keydown", (e) => { const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!d) return; e.preventDefault(); const nx = bs[(Math.max(0, bs.indexOf(document.activeElement)) + d + bs.length) % bs.length]; nx.focus(); nx.click(); });
  g.append(...bs); pick(s.value); row.append(g); rows.append(row);
});
</script></body></html>
